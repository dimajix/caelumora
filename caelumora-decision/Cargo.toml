[package]
name = "caelumora-decision"
version = "0.1.0"
edition = "2021"

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-runtime = { path = "../caelumora-runtime" }
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
uuid = { version = "1.26", features = ["v4"] }

[lints]
workspace = true
