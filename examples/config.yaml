# Every section may be left out and then takes its default; a key that is
# not known is an error, so a misspelt section doesn't silently fall back.

# Where entities (sessions, agents, templates, ...) and runtime state are
# kept: `type: json` with a `path`, or `type: memory` - the default, gone
# when the process ends.
persistence:
  state_store:
    type: json
    path: "local/state_store"
  entity_store:
    type: json
    path: "local/entity_store"

# Demo data put into the entity store at startup: personalities and session
# templates (issue 105). Only what the store does not have yet, by id, so
# restarting changes nothing. Paths are relative to the working directory.
seed:
  - examples/seed.yaml

# Where secrets come from, tried in order. Default: local/secrets.json, then
# the environment.
#secrets:
#  providers:
#    - type: file
#      path: "local/secrets.json"
#    - type: env

# Where the files of workspaces lie (issues 251, 253): storages by name, each
# with its provider. `local` keeps a directory per workspace under `root`.
# `shell: true` lets agents run commands there with `terminal_tool` - on
# Caelumora's host, as its user, with no isolation but the directory: only
# for development. A storage with a shell takes no workspace classified
# above its `destination` (default then: public).
workspaces:
  max_file_bytes: 52428800
  storage:
    files:
      provider: local
      root: "local/workspaces/files"
#    dev:
#      provider: local
#      root: "local/workspaces/dev"
#      shell: true
#      destination: { level: internal }
    # One Open Terminal instance that has the storage at `mount`, e.g. the
    # one of examples/docker-compose.yml; its key is OPEN_TERMINAL_API_KEY in
    # local/secrets.json. Every workspace of it lies in the one instance: a
    # command in one reaches every other.
    sandbox:
      provider: open_terminal_shared
      endpoint:
        url: "http://localhost:8000"
        auth: { type: bearer, secret: OPEN_TERMINAL_API_KEY }
        timeout_secs: 10
      mount: "/home/user/workspaces"
      destination: { level: internal }
    # A volume and an Open Terminal container per workspace, started by
    # Caelumora over the Docker daemon of its environment - access to which
    # is root on the host - and stopped after idle_stop_secs unused. A
    # workspace's commands are kept to its container, which reaches what
    # its network reaches.
#    isolated:
#      provider: open_terminal_docker
#      image: "ghcr.io/open-webui/open-terminal:0.14.0"
#      network: bridge
#      idle_stop_secs: 900
#      destination: { level: confidential }

# Where users and their credentials come from. Without this section nobody
# can authenticate. `accept_any` is a development stand-in that accepts ANY
# username and password - never enable it on a server reachable from a network.
# It gives the users named under `roles` their roles, everybody else
# `default_roles` (issue 142); the roles must be configured below.
users:
  providers:
    - type: accept_any
      default_roles: [staff]
      roles:
        alice: [staff, hr]
        bob: [staff, management]

# Where the REST server listens. Default: 127.0.0.1:3000 - this machine
# only, which `accept_any` above requires.
#server:
#  address: "127.0.0.1:3000"

# Log format and destination; what is logged is selected with RUST_LOG.
# Defaults: text, to stderr (REST server) or local/tui.log (TUI).
#logging:
#  format: json
#  file: "local/server.log"

# User commands every session has (`/help`, `/wakeup`), as components; a
# session template can add its own under `commands`. Without this section the
# built-in ones are used; an empty list switches them off.
#commands:
#  - id: help
#    kind: help_command
#  - id: wakeup
#    kind: wakeup_command

# Components that replace a built-in default for every personality that does
# not configure its own (issue 99): of some facets an agent has exactly one -
# the language model it talks to (`LLMClient`, issue 130), or what assembles
# the model's context (`ContextProvider`) - and a personality without a
# component for it gets the default. A component here must provide exactly
# one such facet. Without this section the built-in defaults are used: for
# the model, `ollama_client` with the Ollama server at 127.0.0.1:11434 and
# the model gemma4:26b. Here that model, configured as docs/LLM-MODELS.md
# recommends for it: senders marked in XML, which it attributes best, and the
# size of its context set, so that it is not cut off at Ollama's default.
# Further parameters, with their defaults:
#      endpoint:
#        url: "http://127.0.0.1:11434"
#      think: true
#      reasoning_history: current_turn
#      system_messages: only_at_start
component_defaults:
  - id: model
    kind: ollama_client
    params:
      model: "gemma4:26b"
      sender_format: xml
      sender_style: handle
      context_size: 65536
#  - id: context
#    kind: turn_context_provider

# Who may do what (issue 11). `ownership` - the default - lets owners do
# everything with their sessions, agents and templates, contributors (e.g.
# the other participants of a session) read and use them, and everybody use
# what belongs to the system. `allow_all` allows everything to everybody:
# tests and single-user development only.
#security:
#  type: ownership

# The compartments a classification may name (issue 133): areas such as a
# topic, a group or a customer, each with the compartments it may read. The
# read relation is closed transitively - here management reads HR, and
# through HR finance too. A channel classified with a compartment is read
# only by channels whose every compartment reads it; a channel without
# compartments reads none of it. Without this section there are no
# compartments.
compartments:
  - name: management
    reads: [hr]
  - name: hr
    reads: [finance]
  - name: finance

# The roles and the clearances each grants (issues 133, 142): a level, and at
# most one compartment - none for what is general. A user's clearance is every
# clearance of their roles, an agent's its owner's - narrowed by the roles
# its personality names, if it names any (an external agent naming none sees
# only what is public); who is not cleared for a channel's classification
# cannot join or read it. A user without a
# clearance sees only what is public. Without this section clearances are
# not checked.
roles:
  - name: staff
    clearances:
      - { level: internal }
  - name: hr
    clearances:
      - { level: confidential, compartment: hr }
  - name: management
    clearances:
      - { level: confidential, compartment: management }
      - { level: confidential }

# What the system restricts of tool calls everywhere (issue 13): a rule asks
# a person to decide each matching call, or denies it - the system never
# allows. A tool is named as the model calls it, `*` for every tool; a
# pattern is a regular expression the whole value of the argument must
# match. Sessions and channels can add rules of their own. Without this
# section there are none.
#approvals:
#  rules:
#    - matcher: { tool: "*" , arguments: { path: "/etc/.*" } }
#      decision: deny
#    - matcher: { tool: fetch }
#      decision: ask
