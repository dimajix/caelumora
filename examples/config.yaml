# Every section may be left out and then takes its default; a key that is
# not known is an error, so a misspelt section doesn't silently fall back.

# Where entities (sessions, agents, templates, ...) and runtime state are
# kept: `type: json` with a `path`, or `type: memory` - the default, gone
# when the process ends.
persistence:
  state_store:
    type: json
    path: "local/state_store"
  entity_store:
    type: json
    path: "local/entity_store"

# Demo data put into the entity store at startup: personalities and session
# templates (issue 105). Only what the store does not have yet, by id, so
# restarting changes nothing. Paths are relative to the working directory.
seed:
  - examples/seed.yaml

# Where secrets come from, tried in order. Default: local/secrets.json, then
# the environment.
#secrets:
#  providers:
#    - type: file
#      path: "local/secrets.json"
#    - type: env

# Where users and their credentials come from. Without this section nobody
# can authenticate. `accept_any` is a development stand-in that accepts ANY
# username and password - never enable it on a server reachable from a network.
users:
  providers:
    - type: accept_any

# Where the REST server listens. Default: 127.0.0.1:3000 - this machine
# only, which `accept_any` above requires.
#server:
#  address: "127.0.0.1:3000"

# Log format and destination; what is logged is selected with RUST_LOG.
# Defaults: text, to stderr (REST server) or local/tui.log (TUI).
#logging:
#  format: json
#  file: "local/server.log"

# User commands every session has (`/help`, `/wakeup`), as components; a
# session template can add its own under `commands`. Without this section the
# built-in ones are used; an empty list switches them off.
#commands:
#  component_nodes:
#    - id: help
#      kind: help_command
#    - id: wakeup
#      kind: wakeup_command

# Components that replace a built-in default for every personality that does
# not configure its own (issue 99): of some facets an agent has exactly one -
# `ContextProvider`, what assembles the model's context, say - and a
# personality without a component for it gets the default. A component here
# must provide exactly one such facet. Without this section the built-in
# defaults are used.
#component_defaults:
#  component_nodes:
#    - id: context
#      kind: state_context_provider

# Who may do what (issue 11). `ownership` - the default - lets owners do
# everything with their sessions, agents and templates, contributors (e.g.
# the other participants of a session) read and use them, and everybody use
# what belongs to the system. `allow_all` allows everything to everybody:
# tests and single-user development only.
#security:
#  type: ownership

