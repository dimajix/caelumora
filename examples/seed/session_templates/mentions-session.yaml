session_templates:
- id: 772a28e1-bb1d-4671-ab6c-e8e0b62136f5
  name: mentions-session
  description: Two assistants that answer only when @-mentioned
  participants:
  - User:
      name: user
  - Agent:
      name: Jonathan
      scope: UserScope
      personality:
        name: jonathan-assistant
  - Agent:
      name: Sassy
      scope: SessionScope
      personality:
        name: sassy-assistant
  channels:
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    - id: responders
      kind: mentions_only_policy
    internal_actors:
    - Approver:
        strategy: Any
    participants:
    - user
    - Jonathan
    - Sassy
