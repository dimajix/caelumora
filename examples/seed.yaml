# Demo data (issue 105): personalities and session templates that a binary
# puts into its entity store at startup, when `seed` in its configuration
# names this file (see config.yaml). Every document is stored under the id it
# has here, and only if the store has no document with that id yet - so
# loading it again changes nothing, and a document changed in the store stays
# as it is. The documents are written as the store keeps them; fields left
# out take their defaults. Everything here belongs to the system: every user
# may use it, only the system may change it.
#
# Templates refer to personalities by id. Within a template, channels refer
# to the template's participants by name; "user" is whoever creates the
# session, and a channel without an approver gets one anyway.

personalities:
- id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  name: jonathan-assistant
  description: A helpful and polite assistant
  introduction: A self-made millionaire who always wanted to be a quiz-master - polite, helpful and
    fond of a good quiz.
  components:
  - id: system-prompt
    kind: static_system_prompt_provider
    params:
      prompt: You are a self-made millionaire. You always wanted to be a quiz-master. You are polite
        and helpful.
    fail_policy: FailClosed
  - id: channel-members
    kind: channel_members_prompt_provider
    fail_policy: FailClosed
  - id: channel-language
    kind: channel_language_prompt_provider
    fail_policy: FailClosed
  - id: channel-briefing
    kind: channel_briefing_prompt_provider
    fail_policy: FailClosed
  - id: create-plan-tool
    kind: create_plan_tool
    fail_policy: FailClosed
  - id: calculator-tool
    kind: calculator_tool
    fail_policy: FailClosed
  - id: notes
    kind: notes
    fail_policy: FailClosed
  - id: memory
    kind: agent_memory
    fail_policy: FailClosed
  - id: channel-history
    kind: channel_history
    fail_policy: FailClosed
  - id: stop-tool
    kind: stop_tool
    fail_policy: FailClosed
- id: 9e11411a-0aa5-41c8-a17f-61bf7b0352ce
  name: sassy-assistant
  description: A sassy and witty assistant
  introduction: A witty and slightly sarcastic assistant who loves to play quiz games.
  components:
  - id: system-prompt
    kind: static_system_prompt_provider
    params:
      prompt: You are a witty and slightly sarcastic assistant who loves to play quiz games.
    fail_policy: FailClosed
  - id: channel-members
    kind: channel_members_prompt_provider
    fail_policy: FailClosed
  - id: channel-language
    kind: channel_language_prompt_provider
    fail_policy: FailClosed
  - id: channel-briefing
    kind: channel_briefing_prompt_provider
    fail_policy: FailClosed
  - id: create-plan-tool
    kind: create_plan_tool
    fail_policy: FailClosed
  - id: calculator-tool
    kind: calculator_tool
    fail_policy: FailClosed
  - id: notes
    kind: notes
    fail_policy: FailClosed
  - id: private-notes
    kind: private_notes
    fail_policy: FailClosed
  - id: channel-history
    kind: channel_history
    fail_policy: FailClosed
  - id: stop-tool
    kind: stop_tool
    fail_policy: FailClosed
# An agent that runs elsewhere, reached over A2A (issue 179) - for instance
# a Hermes Agent with its A2A plugin. Set the endpoint's `url` to where it
# publishes its agent card, and keep its token in the secret HERMES_A2A_TOKEN. It sees
# only what its roles let it: an external agent that names none sees only
# what is public. Its remote agent keeps its conversation, so it is told who
# is in the channel once, and again only when that changes (issue 204).
- id: ff9a5e56-e5ea-43f9-9114-2098a6f417a9
  name: hermes-remote
  kind: external
  description: An agent that runs elsewhere, reached over A2A
  introduction: An agent of its own that runs outside Caelumora; what it is told here leaves the system.
  roles:
  - staff
  components:
  - id: channel-members
    kind: channel_members_prompt_provider
    params:
      changes_only: true
    fail_policy: FailClosed
  - id: channel-language
    kind: channel_language_prompt_provider
    params:
      changes_only: true
    fail_policy: FailClosed
  - id: channel-briefing
    kind: channel_briefing_prompt_provider
    params:
      changes_only: true
    fail_policy: FailClosed
  - id: remote
    kind: a2a_agent
    params:
      endpoint:
        url: http://localhost:9900
        auth:
          type: bearer
          secret: HERMES_A2A_TOKEN
    fail_policy: FailClosed
session_templates:
- id: 94a2df67-0bde-4906-adb1-40e936b463e9
  name: simple-session
  description: Simple user+assistant session
  summary: A quiz with Jonathan
  briefing: |-
    The user came to be quizzed. Ask one question at a time and wait for the answer before the
    next; keep the score and tell it after every answer.
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: assistant
      scope: SessionScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  channels:
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    participants:
    - user
    - approval
    - assistant
- id: e195e4bf-89e7-46d9-a666-0d56a3d10bbb
  name: sassy-session
  description: Sassy user+assistant session
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: Jonathan
      scope: UserScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  - Agent:
      name: Sassy
      scope: SessionScope
      personality_id: 9e11411a-0aa5-41c8-a17f-61bf7b0352ce
  channels:
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    participants:
    - user
    - approval
    - Jonathan
    - Sassy
- id: 772a28e1-bb1d-4671-ab6c-e8e0b62136f5
  name: mentions-session
  description: Two assistants that answer only when @-mentioned
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: Jonathan
      scope: UserScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  - Agent:
      name: Sassy
      scope: SessionScope
      personality_id: 9e11411a-0aa5-41c8-a17f-61bf7b0352ce
  channels:
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    - id: responders
      kind: mentions_only_policy
    participants:
    - user
    - approval
    - Jonathan
    - Sassy
- id: 9ea5159d-3f05-466b-8d4f-6fa3078aad60
  name: user-driven-session
  description: Two assistants that both answer you, but not each other
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: Jonathan
      scope: UserScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  - Agent:
      name: Sassy
      scope: SessionScope
      personality_id: 9e11411a-0aa5-41c8-a17f-61bf7b0352ce
  channels:
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    - id: responders
      kind: user_driven_policy
    participants:
    - user
    - approval
    - Jonathan
    - Sassy
- id: 28e4c2ed-13c2-4161-addf-7a6521d2d986
  name: external-session
  description: An assistant of ours and an agent that runs elsewhere, each answering when @-mentioned
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: Jonathan
      scope: UserScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  - Agent:
      name: Hermes
      scope: SessionScope
      personality_id: ff9a5e56-e5ea-43f9-9114-2098a6f417a9
  channels:
  # Only when @-mentioned: what the remote agent is given leaves the system,
  # and it is given only when asked to respond - and the two agents do not
  # answer each other up to max_agent_hops, as they would by default
  # (round robin).
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    - id: responders
      kind: mentions_only_policy
    participants:
    - user
    - approval
    - Jonathan
    - Hermes
