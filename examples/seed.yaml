# Demo data (issue 105): preconfigured components, personalities, session
# templates and skills that a binary puts into its stores at startup, when
# `seed` in its configuration names this file (see config.yaml). Every
# document is stored under the id it has here, and only if the store has no document with that id yet - so
# loading it again changes nothing, and a document changed in the store stays
# as it is. The documents are written as the store keeps them; fields left
# out take their defaults. Everything here belongs to the system: every user
# may use it, only the system may change it.
#
# Templates refer to personalities by id. Within a template, channels refer
# to the template's participants by name; "user" is whoever creates the
# session, and a channel without an approver gets one anyway.
#
# Skills (issue 22) lie in the global scope: every agent whose personality
# has the `skills` component finds them, loads them when a task calls for one,
# and a member gives one to an agent with `/skill @agent <name>`.
#
# Preconfigured components (issue 270) are kept in the component store under
# their id. A personality includes one with `kind: ref` and `params: { id: ... }`,
# and gets all of its components there, in their order: what every agent should
# have is written once, and an addition reaches every personality that includes
# it. A component of an included one must not be written again beside it.

components:
# Who is in the channel, which language it speaks and what it is about.
- id: channel-context
  components:
  - id: channel-members
    kind: channel_members_prompt_provider
    fail_policy: FailClosed
  - id: channel-language
    kind: channel_language_prompt_provider
    fail_policy: FailClosed
  - id: channel-briefing
    kind: channel_briefing_prompt_provider
    fail_policy: FailClosed
# What every agent run here needs to take part in a channel.
- id: agent-basics
  components:
  - id: stop-tool
    kind: stop_tool
    fail_policy: FailClosed
  - id: ask-user-tool
    kind: ask_user_tool
    fail_policy: FailClosed
  - id: notes
    kind: notes
    fail_policy: FailClosed
  - id: channel-history
    kind: channel_history
    fail_policy: FailClosed
  - id: skills
    kind: skills
    fail_policy: FailOpen

personalities:
- id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  name: jonathan-assistant
  description: A helpful and polite assistant
  introduction: A self-made millionaire who always wanted to be a quiz-master - polite, helpful and
    fond of a good quiz.
  components:
  - id: system-prompt
    kind: static_system_prompt_provider
    params:
      title: Who you are
      prompt: You are a self-made millionaire. You always wanted to be a quiz-master. You are polite
        and helpful.
    fail_policy: FailClosed
  - id: channel-context
    kind: ref
    params:
      id: channel-context
  - id: agent-basics
    kind: ref
    params:
      id: agent-basics
  - id: create-plan-tool
    kind: create_plan_tool
    fail_policy: FailClosed
  - id: calculator-tool
    kind: calculator_tool
    fail_policy: FailClosed
  - id: memory
    kind: agent_memory
    fail_policy: FailClosed
  - id: workspace
    kind: workspace_prompt_provider
    fail_policy: FailClosed
  - id: terminal-tool
    kind: terminal_tool
    fail_policy: FailClosed
  - id: artifact-tool
    kind: artifact_tool
    fail_policy: FailClosed
- id: 9e11411a-0aa5-41c8-a17f-61bf7b0352ce
  name: sassy-assistant
  description: A sassy and witty assistant
  introduction: A witty and slightly sarcastic assistant who loves to play quiz games.
  components:
  - id: system-prompt
    kind: static_system_prompt_provider
    params:
      title: Who you are
      prompt: You are a witty and slightly sarcastic assistant who loves to play quiz games.
    fail_policy: FailClosed
  - id: channel-context
    kind: ref
    params:
      id: channel-context
  - id: agent-basics
    kind: ref
    params:
      id: agent-basics
  - id: create-plan-tool
    kind: create_plan_tool
    fail_policy: FailClosed
  - id: calculator-tool
    kind: calculator_tool
    fail_policy: FailClosed
  - id: private-notes
    kind: private_notes
    fail_policy: FailClosed
# An agent that runs elsewhere, reached over A2A (issue 179) - for instance
# a Hermes Agent with its A2A plugin. Set the endpoint's `url` to where it
# publishes its agent card, and keep its token in the secret HERMES_A2A_TOKEN. It sees
# only what its roles let it: an external agent that names none sees only
# what is public. Its remote agent keeps its conversation, so it is told who
# is in the channel once, and again only when that changes (issue 204) - which
# is why it writes the channel's context out instead of including
# `channel-context`.
- id: ff9a5e56-e5ea-43f9-9114-2098a6f417a9
  name: hermes-remote
  kind: external
  description: An agent that runs elsewhere, reached over A2A
  introduction: An agent of its own that runs outside Caelumora; what it is told here leaves the system.
  roles:
  - staff
  components:
  - id: channel-members
    kind: channel_members_prompt_provider
    params:
      changes_only: true
    fail_policy: FailClosed
  - id: channel-language
    kind: channel_language_prompt_provider
    params:
      changes_only: true
    fail_policy: FailClosed
  - id: channel-briefing
    kind: channel_briefing_prompt_provider
    params:
      changes_only: true
    fail_policy: FailClosed
  - id: remote
    kind: a2a_agent
    params:
      endpoint:
        url: http://localhost:9900
        auth:
          type: bearer
          secret: HERMES_A2A_TOKEN
    fail_policy: FailClosed
session_templates:
- id: 94a2df67-0bde-4906-adb1-40e936b463e9
  name: simple-session
  description: Simple user+assistant session
  summary: A quiz with Jonathan
  briefing: |-
    The user came to be quizzed. Ask one question at a time and wait for the answer before the
    next; keep the score and tell it after every answer.
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: assistant
      scope: SessionScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  channels:
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    participants:
    - user
    - approval
    - assistant
- id: e195e4bf-89e7-46d9-a666-0d56a3d10bbb
  name: sassy-session
  description: Sassy user+assistant session
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: Jonathan
      scope: UserScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  - Agent:
      name: Sassy
      scope: SessionScope
      personality_id: 9e11411a-0aa5-41c8-a17f-61bf7b0352ce
  channels:
  - name: quizz
    summary: Hier wird geraten - und gewusst!
    language: de
    briefing: |-
      In diesem Kanal wird gequizzt: Stellt Quizfragen aus Allgemeinwissen, Geschichte, Geografie,
      Natur, Film, Musik, Sport und Kurioses, mal leicht, mal knifflig. Eine Frage nach der anderen;
      wartet auf die Antwort, bevor die nächste kommt. Löst nach jeder Antwort auf, gebt gern einen
      kleinen Fun Fact dazu und haltet den Punktestand fest.

      Der Ton ist locker, positiv und unterhaltsam: Lob für richtige Antworten, ein Augenzwinkern
      statt Häme bei falschen, gern ein Wortspiel oder ein kleiner Seitenhieb unter euch Quizmastern.
      Alles Ernste ist hier unerwünscht - keine Politik, keine Tragödien, keine Krankheiten, keine
      Ratschläge zu Geld, Recht oder Gesundheit. Kommt das Gespräch dorthin, lenkt es charmant zurück
      zum Quiz.
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    participants:
    - user
    - approval
    - Jonathan
    - Sassy
- id: 772a28e1-bb1d-4671-ab6c-e8e0b62136f5
  name: mentions-session
  description: Two assistants that answer only when @-mentioned
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: Jonathan
      scope: UserScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  - Agent:
      name: Sassy
      scope: SessionScope
      personality_id: 9e11411a-0aa5-41c8-a17f-61bf7b0352ce
  channels:
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    - id: responders
      kind: mentions_only_policy
    participants:
    - user
    - approval
    - Jonathan
    - Sassy
- id: 9ea5159d-3f05-466b-8d4f-6fa3078aad60
  name: user-driven-session
  description: Two assistants that both answer you, but not each other
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: Jonathan
      scope: UserScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  - Agent:
      name: Sassy
      scope: SessionScope
      personality_id: 9e11411a-0aa5-41c8-a17f-61bf7b0352ce
  channels:
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    - id: responders
      kind: user_driven_policy
    participants:
    - user
    - approval
    - Jonathan
    - Sassy
- id: 28e4c2ed-13c2-4161-addf-7a6521d2d986
  name: external-session
  description: An assistant of ours and an agent that runs elsewhere, each answering when @-mentioned
  participants:
  - User:
      name: user
  - Approver:
      name: approval
  - Agent:
      name: Jonathan
      scope: UserScope
      personality_id: 6c109a76-8e67-4e44-ac8d-f97d4be9d3fb
  - Agent:
      name: Hermes
      scope: SessionScope
      personality_id: ff9a5e56-e5ea-43f9-9114-2098a6f417a9
  channels:
  # Only when @-mentioned: what the remote agent is given leaves the system,
  # and it is given only when asked to respond - and the two agents do not
  # answer each other up to max_agent_hops, as they would by default
  # (round robin).
  - name: main
    components:
    - id: moderator
      kind: policy_moderator
      params:
        max_agent_hops: 20
    - id: responders
      kind: mentions_only_policy
    participants:
    - user
    - approval
    - Jonathan
    - Hermes

skills:
- id: 8bdb7961-a455-4063-8be6-98a2f16b46f5
  name: quiz-round
  description: How to run a round of a quiz with the people in the channel
  classification:
    level: internal
  body: |-
    1. Announce the topic and how many questions the round has - five unless asked otherwise.
    2. Ask one question at a time, and wait for every answer before you go on.
    3. Say who was right, with the correct answer and one sentence on why.
    4. Keep the score in a note, and give it after every question.
    5. At the end, name the winner and offer another round.

- id: fdae9abb-9a80-41dd-a383-03d24b887794
  name: write-agents-md
  description: How to write an AGENTS.md for an existing project in the workspace
  classification:
    level: public
  body: |-
    An `AGENTS.md` at the root of a project tells agents - you, and the coding tools people use on the
    same files - how to work on it. Write one that a newcomer could act on at once.

    1. Explore before you write. Look at the layout with `list_files`, then read what the project says
       of itself: the README, the build files (`Cargo.toml`, `package.json`, `pyproject.toml`,
       `pom.xml`, `Makefile`, ...), the CI configuration (`.github/workflows`, `.gitlab-ci.yml`, ...),
       linter and formatter settings, and the documentation directory if there is one. Use
       `grep_files` to find how tests are written and where entry points lie. If you can run shell
       commands, check that the build and test commands you found really work.
    2. If an `AGENTS.md`, `CLAUDE.md` or similar file exists already, read it and improve it rather
       than starting over; ask before you replace what someone wrote.
    3. Write down what is not obvious from the code at a glance:
       - how to build, test, lint and run it, as exact commands, and how to run a single test;
       - how it is laid out: the main directories and what each holds, in a line each;
       - the conventions to keep: style, naming, error handling, how commits and branches are made;
       - what not to do: generated files not to edit, directories not to touch, commands that are slow
         or dangerous;
       - where more is written: documents an agent should read before working on a part.
    4. Leave out what a reader sees in the code at once, long explanations, and anything secret - no
       credentials, tokens or internal addresses.
    5. Keep it short - a page or two - with headings and lists, commands in code blocks. Write it with
       `write_file` at the project's root, then tell the people in the channel what you wrote and what
       you could not verify.
    6. A part of the project with rules of its own can get an `AGENTS.md` in its directory; it applies
       there and takes precedence over the one at the root.
