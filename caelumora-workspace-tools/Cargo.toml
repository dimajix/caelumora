[package]
name = "caelumora-workspace-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-runtime = { path = "../caelumora-runtime" }
caelumora-agents = { path = "../caelumora-agents" }
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt", "time"] }
tracing = "0.1.44"

[dev-dependencies]
caelumora-agents = { path = "../caelumora-agents", features = ["test-support"] }
caelumora-runtime = { path = "../caelumora-runtime", features = ["test-support"] }
tokio = { version = "1.53.1", features = ["full"] }

[lints]
workspace = true
