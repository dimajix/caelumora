[workspace]
members = [
    "caelumora-model",
    "caelumora-runtime",
    "caelumora-tui",
    "caelumora-client-api",
    "caelumora-local-client",
    "caelumora-app",
    "caelumora-rest-api",
    "caelumora-rest-client",
    "caelumora-rest-server",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace.lints.clippy]
# Cloning an Arc or Rc says so: Arc::clone(&value) (CODING-GUIDELINES.md, issue 229).
clone_on_ref_ptr = "warn"
