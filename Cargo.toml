[workspace]
members = [
    "caelumora-model",
    "caelumora-runtime",
    "caelumora-agents",
    "caelumora-logging",
    "caelumora-tui",
    "caelumora-app",
    "caelumora-rest-api",
    "caelumora-rest-client",
    "caelumora-rest-server",
    "caelumora-skills",
    "caelumora-artifacts",
    "caelumora-mcp",
    "caelumora-a2a",
    "caelumora-open-terminal",
    "caelumora-store-json",
    "caelumora-store-postgres",
    "caelumora-workspace-tools",
    "caelumora-ollama",
    "caelumora-decision",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aho-corasick = "1.1"
# Pinned to the version of the npm package the web UI uses (issue 177).
any_ascii = "=0.3.3"
anyhow = "1.0.104"
arc-swap = "1.9.2"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
async-stream = "0.3.6"
async-trait = "0.1"
axum = "0.8.9"
bitflags = "2"
bollard = "0.21"
bytes = "1"
chrono = "0.4.45"
chrono-tz = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.1"
derive_more = { version = "2.1.1", features = ["display"] }
futures = "0.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
meval = "0.2.0"
mime_guess = "2.0.5"
# The prompt catalogue (issue 57): templates with loops and conditions, no
# access to files or the network. `loader` only for templates of owned names
# and sources, read from the catalogue's files.
minijinja = { version = "2.24", default-features = false, features = ["builtins", "loader", "multi_template", "serde"] }
nix = { version = "0.31", features = ["signal", "process"] }
percent-encoding = "2.3"
rand = "0.10.3"
regex = "1.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rmcp = { version = "3.4", features = ["client", "transport-streamable-http-client-reqwest"] }
rust-embed = "8.5.0"
rustyline = "18.0.1"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false }
sse-stream = "0.2"
tempfile = "3.27"
thiserror = "2.0.21"
tokio = "1.53.1"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5"
uuid = "1.26"

# The crates of the workspace.
caelumora-model = { path = "caelumora-model" }
caelumora-runtime = { path = "caelumora-runtime" }
caelumora-agents = { path = "caelumora-agents" }
caelumora-logging = { path = "caelumora-logging" }
caelumora-rest-api = { path = "caelumora-rest-api" }
caelumora-rest-server = { path = "caelumora-rest-server" }
caelumora-skills = { path = "caelumora-skills", default-features = false }
caelumora-artifacts = { path = "caelumora-artifacts", default-features = false }
caelumora-mcp = { path = "caelumora-mcp" }
caelumora-a2a = { path = "caelumora-a2a" }
caelumora-open-terminal = { path = "caelumora-open-terminal" }
caelumora-store-json = { path = "caelumora-store-json" }
caelumora-store-postgres = { path = "caelumora-store-postgres" }
caelumora-workspace-tools = { path = "caelumora-workspace-tools" }
caelumora-ollama = { path = "caelumora-ollama" }
caelumora-decision = { path = "caelumora-decision" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace.lints.rust]
# Nothing `pub` that its crate's root cannot reach: `pub(crate)` by default (CODING-GUIDELINES.md,
# issue 452).
unreachable_pub = "warn"

[workspace.lints.clippy]
# Cloning an Arc or Rc says so: Arc::clone(&value) (CODING-GUIDELINES.md, issue 229).
clone_on_ref_ptr = "warn"
# Rules of CODING-GUIDELINES.md a lint checks, and no debugging output or unfinished code
# (issue 452); clippy.toml allows unwrapping and printing in tests.
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# A function longer than 100 lines says so with an `expect`, which fires once it is shorter
# (CODING-GUIDELINES.md, issue 452).
too_many_lines = "warn"
