[package]
name = "caelumora-store-home"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caelumora-api.workspace = true
caelumora-domain.workspace = true
caelumora-kernel.workspace = true
caelumora-store.workspace = true
caelumora-store-json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
# What lies where is looked up in the directories, and a write of a kind
# waits for a lock of another program on a thread of its own.
tokio = { workspace = true, features = ["fs", "rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
caelumora-domain = { workspace = true, features = ["test-support"] }
caelumora-security = { workspace = true, features = ["test-support"] }
caelumora-store = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
