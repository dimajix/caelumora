[package]
name = "caelumora-ollama"
version = "0.1.0"
edition = "2021"

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-runtime = { path = "../caelumora-runtime" }
caelumora-agent = { path = "../caelumora-agent" }
anyhow = "1.0"
async-stream = "0.3.6"
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
dashmap = "6.2.1"
futures = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tracing = "0.1.44"
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"

[lints]
workspace = true
