# The texts sub-agents give a model (issue 558), namespace `subagents`: templates of `minijinja`,
# rendered by `PromptCatalogue`; the conventions are those of the agents' file
# (`caelumora-agents/src/prompts.yaml`). Names of tools are values.

# What an agent is given to read, in its owner's name, of a sub-agent it started on their word
# (`/subagent`, issue 596): given the `personality`, the `brief`, the `thread` and the names of the
# tools `ask` and `end`.
started: |-
  [Sub-agent started]
  On my word you started a sub-agent of the personality {{ personality }}, in the thread {{ thread }}, on this brief:
  {{ brief }}
  The brief is its whole task: it has it and works on it alone, and nothing more is needed now. What it answers is given to you to read here, in a later turn. After you read its answer, ask it again with {{ ask }} in that turn - left without a word then, it is ended -, or end it with {{ end }} once its work is done.

# The descriptions of the tools (`caelumora_agents::tool::described`); `start_subagent` is given
# the `personalities` it may start an agent of, and the names of the other two, `ask` and `end`;
# those two the name of `start`. `started`, `asked` and `ended`: what the results of the three tell
# of what they did (issue 616).
tools:
  subagents:
    description: >-
      Sub-agents: agents started for a task, each working on it apart, in a thread of its own,
      giving back only what came of it.
    start_subagent: >-
      Start a sub-agent on a task: a new agent of one of the personalities {{ personalities | join(", ") }},
      in a thread of its own at this call. The brief is its whole task: it gets it at once and
      works on it alone - nobody but you gives it anything in its thread. Write the
      brief so that it can be worked on without what was said here. The call returns at once with
      the thread, and nothing more is needed now: finish your other work and end your turn - what
      the sub-agent answers is given to you to read in a later turn. After you read its answer, ask
      it again with {{ ask }} in that turn - left without a word then, it is ended -, or end it with
      {{ end }} once its work is done.
    start_subagent.personality: "The personality of the sub-agent: one of {{ personalities | join(\", \") }}"
    start_subagent.brief: The task, with everything needed to work on it
    started: >-
      The sub-agent has the brief and works on it now. Its answer will be given to you to read in a
      later turn; nothing more is needed until then.
    ask_subagent: >-
      Give a sub-agent you started more to read - a question, a correction, the next task -, in the
      turn in which you read its answer: one you leave without a word then is ended. Do not call it
      before its answer has come: while it works on what it was given, anything more waits until it
      has answered, and is answered after it on its own. What it answers is given to you to read.
    ask_subagent.thread: The thread of the sub-agent, as {{ start }} returned it
    ask_subagent.text: What it is given to read
    asked: >-
      The sub-agent is given what you gave it as soon as it has answered what it was given before.
      Its answer to it will be given to you to read on its own, in a later turn; nothing more is
      needed until then.
    end_subagent: >-
      End a sub-agent you started, once its work is done: it is let go and its thread closed.
    end_subagent.thread: The thread of the sub-agent, as {{ start }} returned it
    ended: The sub-agent is let go and its thread closed.
