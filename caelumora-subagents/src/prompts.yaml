# The texts sub-agents give a model (issue 558), namespace `subagents`: templates of `minijinja`,
# rendered by `PromptCatalogue`; the conventions are those of the agents' file
# (`caelumora-agents/src/prompts.yaml`). Names of tools are values.

# What an agent is given to read, in its owner's name, of a sub-agent it started on their word
# (`/subagent`, issue 596): given the `personality`, the `brief`, the `thread` and the names of the
# tools `ask` and `end`.
started: |-
  [Sub-agent started]
  On my word you started a sub-agent of the personality {{ personality }}, in the thread {{ thread }}, on this brief:
  {{ brief }}
  What it answers is given to you to read here. Ask it again with {{ ask }} in the turn in which you read its answer - left without a word then, it is ended -, or end it with {{ end }} once its work is done.

# The descriptions of the tools (`caelumora_agents::tool::described`); `start_subagent` is given
# the `personalities` it may start an agent of, and the names of the other two, `ask` and `end`;
# those two the name of `start`.
tools:
  subagents:
    description: >-
      Sub-agents: agents started for a task, each working on it apart, in a thread of its own,
      giving back only what came of it.
    start_subagent: >-
      Start a sub-agent on a task: a new agent of one of the personalities {{ personalities | join(", ") }},
      working on the brief apart, in a thread of its own at this call. It returns at once with the
      thread; what the sub-agent answers is given to you to read once it is there. Write the brief so
      that it can be worked on without what was said here. Ask it again with {{ ask }} in the turn
      in which you read its answer - left without a word then, it is ended -, or end it with
      {{ end }} once its work is done.
    start_subagent.personality: "The personality of the sub-agent: one of {{ personalities | join(\", \") }}"
    start_subagent.brief: The task, with everything needed to work on it
    ask_subagent: >-
      Give a sub-agent you started more to read - a question, a correction, the next task -, in the
      turn in which you read its answer: one you leave without a word then is ended. What it
      answers is given to you to read.
    ask_subagent.thread: The thread of the sub-agent, as {{ start }} returned it
    ask_subagent.text: What it is given to read
    end_subagent: >-
      End a sub-agent you started, once its work is done: it is let go and its thread closed.
    end_subagent.thread: The thread of the sub-agent, as {{ start }} returned it
