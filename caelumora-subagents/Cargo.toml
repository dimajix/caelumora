[package]
name = "caelumora-subagents"
version.workspace = true
edition.workspace = true
license.workspace = true

# The layers of the crate (issue 558), as artifacts', memory's and skills' are.
[features]
default = ["kernel", "library"]
# What an agent's work does with sub-agents, and what that fails with: the crate's part of the
# kernel's API, which the plugin serves and the library calls.
api = ["dep:caelumora-api", "dep:async-trait", "dep:thiserror"]
# The writer and the plugin: the kernel's side.
kernel = [
    "api",
    "dep:caelumora-kernel",
    "dep:caelumora-security",
    "dep:rand",
    "dep:tokio",
    "dep:tracing",
    "dep:anyhow",
    "dep:serde",
]
# The component and the library: the agent side.
library = ["api", "dep:caelumora-agents", "dep:anyhow", "dep:serde", "dep:serde_json"]

[dependencies]
caelumora-domain.workspace = true
serde = { workspace = true, optional = true }
caelumora-api = { workspace = true, optional = true }
caelumora-kernel = { workspace = true, optional = true }
caelumora-security = { workspace = true, optional = true }
caelumora-agents = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt"] }
tracing = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
caelumora-security = { workspace = true, features = ["test-support"] }
caelumora-store = { workspace = true, features = ["test-support"] }
caelumora-agents = { workspace = true, features = ["test-support"] }
caelumora-kernel = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true

# Without the features the test is skipped rather than failing to build: it runs the plugin and
# the library in a kernel.
[[test]]
name = "subagents"
required-features = ["kernel", "library"]

[lints]
workspace = true
