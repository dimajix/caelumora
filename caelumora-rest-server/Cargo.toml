[package]
name = "caelumora-rest-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caelumora-model.workspace = true
caelumora-runtime.workspace = true
caelumora-rest-api.workspace = true
axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
tracing.workspace = true
anyhow.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
chrono.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
caelumora-runtime = { workspace = true, features = ["test-support"] }
tower.workspace = true
tempfile.workspace = true
# `start_paused`: tests that wait for a token to expire without waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
