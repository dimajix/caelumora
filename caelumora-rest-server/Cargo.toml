[package]
name = "caelumora-rest-server"
version = "0.1.0"
edition = "2021"

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-runtime = { path = "../caelumora-runtime" }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dashmap = "6.2.1"
futures = "0.3"
tower-http = { version = "0.7.1", features = ["trace"] }
clap = { version = "4.6.7", features = ["derive"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.3"
chrono = "0.4.45"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
# `start_paused`: tests that wait for a token to expire without waiting.
tokio = { version = "1.0", features = ["test-util"] }
