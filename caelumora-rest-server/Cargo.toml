[package]
name = "caelumora-rest-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-runtime = { path = "../caelumora-runtime" }
caelumora-rest-api = { path = "../caelumora-rest-api" }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
anyhow = "1.0"
futures = "0.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.3"
chrono = "0.4.45"
percent-encoding = "2.3"

[dev-dependencies]
caelumora-runtime = { path = "../caelumora-runtime", features = ["test-support"] }
tower = { version = "0.5.3", features = ["util"] }
# `start_paused`: tests that wait for a token to expire without waiting.
tokio = { version = "1.0", features = ["test-util"] }

[lints]
workspace = true
