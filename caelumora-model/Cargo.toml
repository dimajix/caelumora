[package]
name = "caelumora-model"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
sha256 = "1.6.0"
thiserror = "2.0.21"
derive_more = { version = "2.1.1", features = ["display"] }
arc-swap = "1.9.2"
async-trait = "0.1"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tempfile = "3.27"
