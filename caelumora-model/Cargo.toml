[package]
name = "caelumora-model"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Only parsing is needed; the snippet rendering it brings is switched off
# in `AppConfig::from_yaml`.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
sha2 = "0.11"
thiserror = "2.0.21"
derive_more = { version = "2.1.1", features = ["display"] }
arc-swap = "1.9.2"
async-trait = "0.1"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tempfile = "3.27"
