[package]
name = "caelumora-model"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
sha256 = "1.6.0"
thiserror = "2.0.18"
derive_more = "0.99.20"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
tempfile = "3.10"
