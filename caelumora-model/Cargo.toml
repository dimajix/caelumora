[package]
name = "caelumora-model"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Only parsing is needed; the snippet rendering it brings is switched off
# in `AppConfig::from_yaml`.
serde-saphyr.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
anyhow.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The texts given to models (issue 57).
minijinja.workspace = true
derive_more.workspace = true
bitflags.workspace = true
async-trait.workspace = true
tracing.workspace = true
# Names and handles are compared by their ASCII form (issue 177); the web UI
# uses the npm package of the same name. Both pinned to one version, so that
# their tables agree.
any_ascii.workspace = true
# The patterns of approval rules (issue 13): no backtracking, so that a
# pattern takes linear time whatever it is matched against.
regex.workspace = true
# The user file is read asynchronously, and a password verified on a
# blocking thread (`rt`, issue 25).
tokio = { workspace = true, features = ["fs", "rt"] }
# The URL of a remote endpoint, parsed to show it without credentials.
url.workspace = true
# The password hashes of the user file (issue 25), verified only: hashes
# are made by hand, so no random salts are needed here.
argon2.workspace = true
# The time zone a session is held in (issue 424): the IANA names and their
# rules, compiled in, so that a time is given the same on every machine.
chrono-tz.workspace = true
# The content of an attachment, on the copy of a message a model is given
# (issue 282).
bytes.workspace = true

[features]
# What the tests of other crates read of a model value held in memory
# (`history::testing`, issue 392), the messages, references to contents,
# channels, sessions, templates and personalities they write
# (`message::testing`, `content::testing`, `channel::testing`,
# `session::testing`, `template::testing`, `agent::testing`), the suite every
# backend of the stores runs (`store::suite`, issue 446) and the stores that
# refuse a write as outdated (`store::testing`, issue 492).
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tempfile.workspace = true

[lints]
workspace = true
