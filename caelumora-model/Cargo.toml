[package]
name = "caelumora-model"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Only parsing is needed; the snippet rendering it brings is switched off
# in `AppConfig::from_yaml`.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
sha2 = "0.11"
thiserror = "2.0.21"
derive_more = { version = "2.1.1", features = ["display"] }
bitflags = "2"
async-trait = "0.1"
tracing = "0.1.44"
# Names and handles are compared by their ASCII form (issue 177); the web UI
# uses the npm package of the same name. Both pinned to one version, so that
# their tables agree.
any_ascii = "=0.3.3"
# The patterns of approval rules (issue 13): no backtracking, so that a
# pattern takes linear time whatever it is matched against.
regex = "1.12"
# The JSON store reads and writes files asynchronously, and keeps names
# unique under a lock per kind (issue 250).
tokio = { version = "1.53.1", features = ["fs", "io-util", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
tempfile = "3.27"

[lints]
workspace = true
