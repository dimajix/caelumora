[package]
name = "caelumora-a2a"
version = "0.1.0"
edition = "2021"

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-runtime = { path = "../caelumora-runtime" }
caelumora-agents = { path = "../caelumora-agents" }
anyhow = "1.0"
arc-swap = "1.9.2"
async-stream = "0.3.6"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sse-stream = "0.2"
tokio = { version = "1.53.1", features = ["time"] }
tracing = "0.1.44"
uuid = { version = "1.26", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"

[lints]
workspace = true
