[package]
name = "caelumora-app"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["web-ui"]
# The web UI, built in `caelumora-web-ui/dist`, served from the binary.
# Without it the binary serves the API alone.
web-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-runtime = { path = "../caelumora-runtime" }
caelumora-agents = { path = "../caelumora-agents" }
caelumora-logging = { path = "../caelumora-logging" }
caelumora-rest-server = { path = "../caelumora-rest-server" }
caelumora-skills = { path = "../caelumora-skills" }
caelumora-artifacts = { path = "../caelumora-artifacts" }
caelumora-mcp = { path = "../caelumora-mcp" }
caelumora-a2a = { path = "../caelumora-a2a" }
caelumora-open-terminal = { path = "../caelumora-open-terminal" }
caelumora-workspace-tools = { path = "../caelumora-workspace-tools" }
caelumora-ollama = { path = "../caelumora-ollama" }
caelumora-decision = { path = "../caelumora-decision" }
axum = "0.8.9"
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
anyhow = "1.0"
tower-http = { version = "0.7.1", features = ["trace"] }
clap = { version = "4.6.7", features = ["derive"] }
rust-embed = { version = "8.5.0", optional = true }
mime_guess = { version = "2.0.5", optional = true }

[dev-dependencies]
caelumora-agents = { path = "../caelumora-agents", features = ["test-support"] }
tower = { version = "0.5.3", features = ["util"] }
serde_json = "1.0"

[lints]
workspace = true
