[package]
name = "caelumora-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["web-ui"]
# The web UI, built in `caelumora-web-ui/dist`, served from the binary.
# Without it the binary serves the API alone.
web-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
caelumora-model.workspace = true
caelumora-runtime.workspace = true
caelumora-agents.workspace = true
caelumora-logging.workspace = true
caelumora-rest-server.workspace = true
caelumora-skills = { workspace = true, default-features = true }
caelumora-artifacts = { workspace = true, default-features = true }
caelumora-mcp.workspace = true
caelumora-a2a.workspace = true
caelumora-open-terminal.workspace = true
caelumora-workspace-tools.workspace = true
caelumora-ollama.workspace = true
caelumora-decision.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tracing.workspace = true
anyhow.workspace = true
tower-http.workspace = true
clap.workspace = true
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

[dev-dependencies]
caelumora-agents = { workspace = true, features = ["test-support"] }
tower.workspace = true
serde_json.workspace = true

[lints]
workspace = true
