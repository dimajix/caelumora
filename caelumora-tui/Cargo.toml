[package]
name = "caelumora-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-runtime = { path = "../caelumora-runtime" }
caelumora-logging = { path = "../caelumora-logging" }
caelumora-skills = { path = "../caelumora-skills", default-features = false, features = ["runtime"] }
caelumora-mcp = { path = "../caelumora-mcp" }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
rustyline = "18.0.1"
anyhow = "1.0.104"
chrono = "0.4"
uuid = "1"
serde_json = "1.0"
tracing = "0.1.44"

[lints]
workspace = true
