[package]
name = "caelumora-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true

# The layers of the plugin (issue 323, cut 11): without features the entity
# and the wire types, which a client reads.
[features]
default = ["runtime", "server"]
# The manager, the component, the views, the plugin.
runtime = ["dep:caelumora-runtime", "dep:caelumora-agents", "dep:async-trait", "dep:tokio", "dep:futures", "dep:tracing", "dep:anyhow", "dep:thiserror", "dep:serde_json"]
# The routes, and how the plugin's errors are answered.
server = ["runtime", "dep:caelumora-rest-server", "dep:axum"]

[dependencies]
caelumora-model.workspace = true
caelumora-rest-api.workspace = true
serde.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
caelumora-runtime = { workspace = true, optional = true }
caelumora-agents = { workspace = true, optional = true }
caelumora-rest-server = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
caelumora-agents = { workspace = true, features = ["test-support"] }
caelumora-runtime = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true
bytes.workspace = true
tower.workspace = true

# Without the feature the test is skipped rather than failing to build:
# its tests run the plugin in a runtime, its routes too.
[[test]]
name = "artifacts"
required-features = ["server"]

[lints]
workspace = true
