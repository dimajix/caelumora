[package]
name = "caelumora-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true

# The layers of the crate (issue 323, cut 11; issue 516): without features the
# entity and the wire types, which a client reads.
[features]
default = ["kernel", "library", "server"]
# What an agent's work publishes through, and what that fails with: the
# crate's part of the kernel's API, which the plugin serves and the library
# calls.
api = ["dep:caelumora-api", "dep:async-trait", "dep:thiserror"]
# The manager, the views, the plugin: the kernel's side.
kernel = ["api", "dep:caelumora-kernel", "dep:tracing", "dep:anyhow"]
# The component and the library: the agent side.
library = ["api", "dep:caelumora-agents", "dep:anyhow", "dep:serde_json"]
# The routes, and how the plugin's errors are answered.
server = ["kernel", "dep:caelumora-rest-server", "dep:axum"]

[dependencies]
caelumora-model.workspace = true
caelumora-rest-api.workspace = true
serde.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
caelumora-api = { workspace = true, optional = true }
caelumora-kernel = { workspace = true, optional = true }
caelumora-agents = { workspace = true, optional = true }
caelumora-rest-server = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
caelumora-agents = { workspace = true, features = ["test-support"] }
caelumora-kernel = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true
futures.workspace = true
serde_json.workspace = true
bytes.workspace = true
tower.workspace = true

# Without the features the test is skipped rather than failing to build:
# its tests run the plugin and the library in a kernel, its routes too.
[[test]]
name = "artifacts"
required-features = ["server", "library"]

[lints]
workspace = true
