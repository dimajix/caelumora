[package]
name = "caelumora-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true

# The layers of the plugin (issue 323, cut 11): without features the entity
# and the wire types, which a client reads.
[features]
default = ["runtime", "server"]
# The manager, its storages, the component, the views, the plugin.
runtime = ["dep:caelumora-runtime", "dep:caelumora-agents", "dep:async-trait", "dep:tokio", "dep:tokio-util", "dep:futures", "dep:tracing", "dep:anyhow", "dep:thiserror", "dep:serde_json"]
# The routes, and how the plugin's errors are answered.
server = ["runtime", "dep:caelumora-rest-server", "dep:axum"]

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-rest-api = { path = "../caelumora-rest-api" }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
caelumora-runtime = { path = "../caelumora-runtime", optional = true }
caelumora-agents = { path = "../caelumora-agents", optional = true }
caelumora-rest-server = { path = "../caelumora-rest-server", optional = true }
axum = { version = "0.8.9", optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1.53.1", features = ["sync", "fs"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1.44", optional = true }
anyhow = { version = "1.0", optional = true }
thiserror = { version = "2.0.21", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
caelumora-agents = { path = "../caelumora-agents", features = ["test-support"] }
caelumora-runtime = { path = "../caelumora-runtime", features = ["test-support"] }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0"
tempfile = "3.27"
bytes = "1"
tower = { version = "0.5.3", features = ["util"] }

# Without the feature the test is skipped rather than failing to build:
# its tests run the plugin in a runtime, its routes too.
[[test]]
name = "artifacts"
required-features = ["server"]

[lints]
workspace = true
