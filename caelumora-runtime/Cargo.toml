[package]
name = "caelumora-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
caelumora-model = { path = "../caelumora-model" }
anyhow = "1.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1.0"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3.6"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio-stream = "0.1.18"
rand = "0.10.1"
arc-swap = "1.7.1"
meval = "0.2.0"
rmcp = { version = "0.9", features = ["client", "transport-streamable-http-client-reqwest"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
rmcp = { version = "0.9", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
axum = "0.8.9"
schemars = "1.0"
