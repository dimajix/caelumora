[package]
name = "caelumora-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
caelumora-model = { path = "../caelumora-model" }
anyhow = "1.0"
thiserror = "2.0.21"
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.2.1"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-stream = "0.1.19"
tokio-util = "0.7"
rand = "0.10.3"
arc-swap = "1.9.2"
meval = "0.2.0"
rmcp = { version = "3.4", features = ["client", "transport-streamable-http-client-reqwest"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
rmcp = { version = "3.4", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
axum = "0.8.9"
schemars = "1.2"
