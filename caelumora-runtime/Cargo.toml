[package]
name = "caelumora-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
caelumora-model = { path = "../caelumora-model" }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1.0"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3.6"
oneshot = {  version = "0.2.1", features = ["std", "async"] }
tokio = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
