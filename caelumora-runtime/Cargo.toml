[package]
name = "caelumora-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
caelumora-model = { path = "../caelumora-model" }
anyhow = "1.0"
thiserror = "2.0.21"
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.2.1"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "process"] }
nix = { version = "0.31", features = ["signal", "process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "multipart", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-stream = "0.1.19"
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
bytes = "1"
sse-stream = "0.2"
rand = "0.10.3"
arc-swap = "1.9.2"
aho-corasick = "1.1"
regex = "1.12"
meval = "0.2.0"
bollard = "0.21"
tracing = "0.1.44"
tempfile = { version = "3.27", optional = true }

[features]
# The world of the security suite (`testing`), for the suite and for the
# tests of a plugin (issue 323).
test-support = ["dep:tempfile"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["multipart"] }
tempfile = "3.27"
caelumora-runtime = { path = ".", features = ["test-support"] }

[lints]
workspace = true
