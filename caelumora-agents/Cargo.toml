[package]
name = "caelumora-agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caelumora-model.workspace = true
caelumora-runtime.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "process"] }
serde.workspace = true
serde_json.workspace = true
tokio-util = { workspace = true, features = ["io", "rt"] }
aho-corasick.workspace = true
meval.workspace = true
tracing.workspace = true

[features]
# The world of the agents' tests (`testing`), on that of the security
# suite, for the agents' suite and for the tests of a plugin (issue 370).
test-support = ["caelumora-runtime/test-support"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
caelumora-runtime = { workspace = true, features = ["test-support"] }
caelumora-agents = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
