[package]
name = "caelumora-agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caelumora-model.workspace = true
caelumora-api.workspace = true
caelumora-kernel = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "process"] }
serde.workspace = true
serde_json.workspace = true
tokio-util = { workspace = true, features = ["io", "rt"] }
meval.workspace = true
tracing.workspace = true

[features]
# The world of the agents' tests (`testing`), on that of the security
# suite, for the agents' suite and for the tests of a plugin (issue 370).
test-support = ["dep:caelumora-kernel", "caelumora-kernel/test-support"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
caelumora-model = { workspace = true, features = ["test-support"] }
caelumora-kernel = { workspace = true, features = ["test-support"] }
caelumora-agents = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
