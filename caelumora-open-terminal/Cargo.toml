[package]
name = "caelumora-open-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caelumora-model.workspace = true
caelumora-runtime.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono = { workspace = true, features = ["serde"] }
futures.workspace = true
reqwest = { workspace = true, features = ["stream", "multipart"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
bollard = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }

[features]
default = ["docker"]
# The storage `open_terminal_docker`, a container per workspace started over
# the Docker daemon (issue 327): without it, a deployment with one shared
# instance builds without `bollard`.
docker = ["dep:bollard", "dep:tokio-util", "dep:uuid"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true, features = ["multipart"] }
bytes.workspace = true
nix.workspace = true
tempfile.workspace = true
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
