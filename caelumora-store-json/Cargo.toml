[package]
name = "caelumora-store-json"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caelumora-domain.workspace = true
caelumora-security.workspace = true
caelumora-store.workspace = true
caelumora-api.workspace = true
caelumora-kernel.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# The files are read and written asynchronously, and names kept unique
# under a lock per kind (issue 250).
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
caelumora-security = { workspace = true, features = ["test-support"] }
caelumora-store = { workspace = true, features = ["test-support"] }
caelumora-domain = { workspace = true, features = ["test-support"] }
chrono.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
