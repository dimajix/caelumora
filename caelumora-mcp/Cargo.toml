[package]
name = "caelumora-mcp"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
caelumora-model = { path = "../caelumora-model" }
caelumora-runtime = { path = "../caelumora-runtime" }
caelumora-agents = { path = "../caelumora-agents" }
anyhow = "1.0"
async-trait = "0.1"
rmcp = { version = "3.4", features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
caelumora-agents = { path = "../caelumora-agents", features = ["test-support"] }
caelumora-runtime = { path = "../caelumora-runtime", features = ["test-support"] }
tokio = { version = "1.53.1", features = ["full"] }
rmcp = { version = "3.4", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
axum = "0.8.9"
schemars = "1.2"
chrono = "0.4"

[lints]
workspace = true
